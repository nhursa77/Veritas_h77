name: CI Smoke Windows

on:
  push:
    paths:
      - "alati/**"
      - "paketi/**"
      - "baza_zakona/**"
      - "izvori/**"
      - "postupci/**"
      - "predlosci/**"
      - "predmeti/**"
      - ".githooks/**"
      - ".github/workflows/**"
      - "dokumentacija/**"
      - "AGENTS.md"
      - "README.md"
      - "requirements.txt"
      - ".editorconfig"
      - ".gitattributes"
      - ".gitignore"
      - ".markdownlint.json"
  pull_request:
    paths:
      - "alati/**"
      - "paketi/**"
      - "baza_zakona/**"
      - "izvori/**"
      - "postupci/**"
      - "predlosci/**"
      - "predmeti/**"
      - ".githooks/**"
      - ".github/workflows/**"
      - "dokumentacija/**"
      - "AGENTS.md"
      - "README.md"
      - "requirements.txt"
      - ".editorconfig"
      - ".gitattributes"
      - ".gitignore"
      - ".markdownlint.json"

permissions:
  contents: read

jobs:
  smoke-windows:
    name: Smoke (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: hashFiles('requirements.txt') != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install -r requirements.txt

      - name: Set UTF-8 console
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          chcp 65001

      - name: Run ci_smoke entrypoint
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "CI_SMOKE_WORKFLOW=windows"
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\alati\ci_smoke.ps1
