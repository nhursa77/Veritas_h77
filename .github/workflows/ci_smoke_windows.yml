name: CI Smoke Windows

on:
  push:
    paths:
      - "alati/**"
      - "paketi/**"
      - "baza_zakona/**"
      - "izvori/**"
      - ".github/workflows/**"
      - "dokumentacija/**"
      - "README.md"
  pull_request:
    paths:
      - "alati/**"
      - "paketi/**"
      - "baza_zakona/**"
      - "izvori/**"
      - ".github/workflows/**"
      - "dokumentacija/**"
      - "README.md"

jobs:
  smoke-windows:
    name: Smoke (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip
          if (Test-Path -LiteralPath "requirements.txt") {
            pip install -r requirements.txt
          }
          else {
            pip install pypdf
          }

      - name: Set UTF-8 console
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          chcp 65001

      - name: Run ci_smoke entrypoint
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\alati\ci_smoke.ps1
