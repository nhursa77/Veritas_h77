name: CI Smoke Windows

on:
  push:
    paths:
      - "alati/**"
      - "paketi/**"
      - "baza_zakona/**"
      - "izvori/**"
      - ".github/workflows/**"
      - "dokumentacija/**"
      - "README.md"
  pull_request:
    paths:
      - "alati/**"
      - "paketi/**"
      - "baza_zakona/**"
      - "izvori/**"
      - ".github/workflows/**"
      - "dokumentacija/**"
      - "README.md"

jobs:
  smoke-windows:
    name: Smoke (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12 (pip cache)
        if: hashFiles('requirements.txt', 'requirements-dev.txt', 'pyproject.toml', 'poetry.lock') != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml
            poetry.lock

      - name: Setup Python 3.12 (no cache)
        if: hashFiles('requirements.txt', 'requirements-dev.txt', 'pyproject.toml', 'poetry.lock') == ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: hashFiles('requirements.txt') != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install -r requirements.txt

      - name: Set UTF-8 console
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          chcp 65001

      - name: Run ci_smoke entrypoint
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "CI_SMOKE_WORKFLOW=windows"
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\alati\ci_smoke.ps1
